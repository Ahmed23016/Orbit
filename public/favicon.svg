<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0c1330" />
      <stop offset="0.55" stop-color="#1a2150" />
      <stop offset="1" stop-color="#2c2558" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e2aa" />
      <stop offset="1" stop-color="#c4964a" />
    </linearGradient>
    <radialGradient id="sun-glow">
      <stop offset="0" stop-color="#fff6de" stop-opacity="0.7" />
      <stop offset="1" stop-color="#fff6de" stop-opacity="0" />
    </radialGradient>
    <mask id="crescent">
      <circle cx="512" cy="512" r="238" fill="#fff" />
      <circle cx="624" cy="434" r="208" fill="#000" />
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="url(#sky)" />
  <g fill="#fff">
    <circle cx="190" cy="210" r="5" opacity="0.8" />
    <circle cx="820" cy="190" r="4" opacity="0.75" />
    <circle cx="880" cy="330" r="3" opacity="0.5" />
    <circle cx="160" cy="760" r="3" opacity="0.5" />
    <circle cx="760" cy="860" r="4" opacity="0.6" />
  </g>

  <g transform="rotate(-20 512 512)" fill="none" stroke="#e3bd72" stroke-width="24">
    <!-- Back half of the orbit, behind the moon. -->
    <path d="M102 512 A410 128 0 0 1 922 512" />
  </g>

  <rect width="1024" height="1024" fill="url(#gold)" mask="url(#crescent)" />

  <!-- Front half, with a gap cut into the moon so the ring reads in front of it. -->
  <g mask="url(#crescent)">
    <g transform="rotate(-20 512 512)" fill="none">
      <path d="M102 512 A410 128 0 0 0 922 512" stroke="#1a2150" stroke-width="50" />
    </g>
  </g>
  <g transform="rotate(-20 512 512)" fill="none">
    <path d="M102 512 A410 128 0 0 0 922 512" stroke="#e3bd72" stroke-width="24" />
  </g>

  <!-- Sun on the orbit (38° along the ellipse, then tilted). -->
  <circle cx="843" cy="476" r="70" fill="url(#sun-glow)" />
  <circle cx="843" cy="476" r="34" fill="#fff6de" />
</svg>
